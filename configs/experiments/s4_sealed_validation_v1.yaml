metadata:
  stage: S4-B
  purpose: one_time_sealed_validation_of_frozen_leaky_integrator
  scientific_gate: confirm_s4a_controller_on_unopened_conditions
  allow_scientific_claims: false

environment_config: configs/environment/s1_taylor_v1.yaml
upstream_s4a_summary: outputs/s4_linear_robustness_v1/summary.json
upstream_s4a_config: configs/experiments/s4_linear_robustness_v1.yaml

frozen_controller:
  name: leaky_integrator
  parameters:
    gain: 0.35
    leak: 0.10
  selected_by: S4-A_development_power_in_bucket

evaluation:
  steps: 200
  primary_metric: power_in_bucket
  observation_kind: noisy_oracle_modal_features
  common_slm_delay_frames: 2
  reference_controller: no_correction
  sealed_condition_ids:
    - test_frozen_01
    - test_frozen_02
    - test_boiling_01
    - test_boiling_02
    - test_combined_01
    - test_combined_02

gate:
  # 封存前预声明：不仅要求方向正确，还要求桶内功率有实际大小的改善。
  min_power_delta_ci95_low: 0.05
  min_mean_relative_power_gain: 0.10
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05
  require_every_condition_power_positive: true

# 这些哈希在封存测试打开前冻结。任一代码文件变化都必须停止，不能自动更新后继续。
