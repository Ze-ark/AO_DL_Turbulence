  primary_late_update: 8
  batch_size: 32
  log_interval_updates: 4
  selection_interval_updates: 4
  profile_ids: [nominal, combined_moderate]
  probe_steps: [0, 4]
  bootstrap_replicates: 100
  scientific_interpretation: QUICK_SMOKE_ONLY

