  experiment_id: AO-S4-D2-R3-D2-A-FROZEN-ACTOR-CRITIC-REPAIR
  version_label: s4d2_r3_d2a_multistep_critic_repair_v1
  purpose: compare_frozen_actor_critic_targets_before_any_full_rl_retraining
  hypothesis: at_least_one_long_or_mixed_target_corrects_actor_ranking_for_all_three_policy_seeds
  user_authorized_training_preparation: true
  allow_formal_critic_training: true
  allow_actor_updates: false
