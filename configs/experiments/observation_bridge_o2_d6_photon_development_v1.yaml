# O2-D6：单因素光子噪声完整开发对照；冻结模型，不训练、不确认。
schema: observation_bridge_o2_d6_photon_development_v1
scope: synthetic_photon_noise_development_not_confirmation
device: cuda
optics_config: configs/experiments/observation_bridge_o2_optics_v1.yaml
parent: configs/experiments/s4_r5_policy_training_v1.yaml
data:
  weather_seed_base: 9000000
  weather_count: 8
  weather_seed_stride: 10000
  episode_length: 200
  camera_ids: [noiseless, photon_k100, photon_k10]
quick:
  weather_seed_base: 9160000
  weather_count: 1
  weather_seed_stride: 10000
  episode_length: 28
  camera_ids: [noiseless, photon_k10]
family_ids: [frozen, boiling, varying]
camera_conditions:
  - {id: noiseless, counts_per_intensity_unit: null}
  - {id: photon_k100, counts_per_intensity_unit: 100.0}
  - {id: photon_k10, counts_per_intensity_unit: 10.0}
camera_seed_offset: 180000000
camera_level_seed_stride: 1000000
camera_frame_seed_stride: 10
noise_distribution: poisson_counts_divided_by_fixed_exposure_scale
noise_units: synthetic_detected_counts_per_arbitrary_intensity_unit
read_noise_std: 0.0
image_dependent_normalization: false
shared_draw_across_levels: false
zero_noise_draws: 0
batch_size: 3
controller_branches: 13
policy_initializations: [0, 1, 2]
scorer_seeds: [7564000, 7564001, 7564002]
selector_start_step: 25
integrator: {gain: 0.15, leak: 0.1, tracking_gain: 0.5}
policy_scale: 1.75
candidate_epsilon: 0.1
thresholds:
  ideal_modal_error_max_rad: 0.001
  noisy_modal_rmse_mean_rad: 0.01
  noisy_modal_rmse_p95_rad: 0.02
  replay_max_absolute_error: 1.0e-6
  invalid_observations: 0
  failed_or_truncated_episodes: 0
statistics:
  cluster: complete_weather
  stratification: fixed_scorer_fold
  bootstrap_seed: 9180000
  bootstrap_repeats: 5000
  interval: 0.95
  interval_scope: pointwise_descriptive_not_simultaneous_not_confirmation
gain_threshold: null
output_directory: outputs/observation_bridge_o2_d6_photon_development_v1
quick_directory: outputs/observation_bridge_o2_d6_photon_development_v1_quick
boundary:
  training_updates: 0
  independent_confirmation: false
  old_confirmation_trajectory_access: false
  real_data_access: false
  real_slm_actions: false
  historical_gate_reclassification: false
  truth_fallback: false
  automatic_retry: false
