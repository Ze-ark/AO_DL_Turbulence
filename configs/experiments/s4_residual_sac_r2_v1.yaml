metadata:
  stage: S4-D2-R2
  purpose: capacity_supported_high_dimensional_residual_sac
  hypothesis: a_passing_zernike_representation_allows_sac_to_exceed_the_frozen_ten_mode_baseline
  progress_stage_label: S4-D2-R2
  user_authorized_next_stage: true
  allow_real_hardware_actions: false
  allow_prior_trajectory_reuse: false
  allow_sealed_test_access: false
  allow_gate_relaxation: false
  allow_algorithm_change: false
  allow_reward_change: false
  allow_total_action_budget_increase: false

upstream_capacity:
  summary: outputs/s4_representation_capacity_v1/summary.json
  summary_sha256: 3c1dba3bd10cdea69a4fdf5e585d3fedc45c0b6a6edce805af4caba12cf98165
  source_manifest: outputs/s4_representation_capacity_v1/source_manifest.json
  source_manifest_sha256: 761470f0bff4db862c41c25ef2d5ed07aa83c085ce7fd337d91e4e913e5163ed
  scenario_records: outputs/s4_representation_capacity_v1/scenario_records.csv
  scenario_records_sha256: e72e1e5ab83e56e9eb08c4e1e85f9a9a48e050bb088ca03625ed7d0198382693
  experiment_config: configs/experiments/s4_representation_capacity_v1.yaml
  experiment_config_sha256: 39ce9cf585dc2195b1d87dd68a7b93ad7292aab60050aadc53dff863fda93c4c
  audit_record: docs/S4-D2-R1动作表示容量扫描审计记录.md
  audit_record_sha256: 93271282c68cd7e055689e9355c65020499fd2d03eaf72ee4fb39796271de528

environment_config: configs/environment/s1_taylor_v1.yaml
environment_config_sha256: 8172a07efb2607544011a9fc959f4ab4fbed9a471de9c0112dd15f1d45e5976a
hardware_profile_source: configs/experiments/s4_hardware_stress_v1.yaml
hardware_profile_source_sha256: fb6cb5a3e86fa0445345e47b084722a5c1613d07eab73f596c32afb6c4ce07e8

representations:
  - id: zernike_21
    kind: zernike
    num_modes: 21
    role: primary_smallest_passing_representation
  - id: zernike_36
    kind: zernike
    num_modes: 36
    role: capacity_challenger

frozen_controller:
  id: tracking_conservative
  active_anchor_modes: 10
  kind: tracking_leaky_integrator
  parameters:
    gain: 0.25
    leak: 0.10
    tracking_gain: 0.50
    max_request_step_rad: 0.15

policy_observation:
  history_frames: 4
  include_oracle_quality_metrics: false
  fields:
    - residual_modal_noisy_all_representation_modes
    - applied_modal_all_representation_modes
    - requested_modal_all_representation_modes
    - frozen_ten_mode_baseline_delta_zero_padded

action:
  residual_action_limit_rad: 0.05
  final_action_step_limit_rad: 0.15
  preserve_total_phase_rms_budget: true
  total_budget_anchor_modes: 10
  preserve_environment_modal_limit: true

reward:
  measured_power_weight: 1.0
  residual_action_weight: 0.01
  violation_weight: 0.50
  scientific_metrics_are_separate: true

# 保持原S4-D2/R1的SAC网络和训练预算，只改变经过容量诊断支持的动作表示契约。
sac:
  hidden_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  initial_alpha: 0.05
  replay_buffer_size: 500000
  replay_storage_device: cpu
  batch_size: 256
  warmup_transitions: 20000
  total_transitions_per_seed: 499200
  updates_per_environment_step: 4
  validation_interval_transitions: 50000
  checkpoint_interval_transitions: 100000
  log_interval_transitions: 2048

# 两种表示共享策略随机种子和物理轨迹，便于配对比较；不会读取旧阶段轨迹文件。
policy_seeds:
  - 7101
  - 7102
  - 7103
training_environment_seed_bases:
  - 2800000
  - 2820000
  - 2840000
training_seed_span_per_policy: 10000

training_physical_conditions:
  - id: r2_train_frozen
    regime: frozen_stationary
    wind_speed_mps: 0.45
    wind_direction_deg: 15.0
    slm_delay_frames: 2
  - id: r2_train_boiling
    regime: boiling_stationary_wind
    wind_speed_mps: 0.55
    wind_direction_deg: 60.0
    frozen_flow_rho: 0.995
    slm_delay_frames: 2
  - id: r2_train_combined
    regime: boiling_varying_wind_noisy
    wind_speed_mps: 0.60
    wind_direction_deg: 75.0
    frozen_flow_rho: 0.995
    wind_speed_modulation_fraction: 0.15
    wind_direction_modulation_deg: 15.0
    wind_modulation_period_frames: 80
    wind_modulation_phase_deg: 135.0
    slm_delay_frames: 2

training_hardware_profile_ids:
  - nominal
  - delay_3
  - settling_050
  - registration_moderate
  - registration_severe
  - combined_moderate

validation_physical_conditions:
  - id: r2_val_frozen
    regime: frozen_stationary
    base_seed: 2860000
    wind_speed_mps: 0.525
    wind_direction_deg: 30.0
    slm_delay_frames: 2
  - id: r2_val_boiling
    regime: boiling_stationary_wind
    base_seed: 2861000
    wind_speed_mps: 0.625
    wind_direction_deg: 45.0
    frozen_flow_rho: 0.995
    slm_delay_frames: 2
  - id: r2_val_combined
    regime: boiling_varying_wind_noisy
    base_seed: 2862000
    wind_speed_mps: 0.50
    wind_direction_deg: 85.0
    frozen_flow_rho: 0.995
    wind_speed_modulation_fraction: 0.15
    wind_direction_modulation_deg: 15.0
    wind_modulation_period_frames: 80
    wind_modulation_phase_deg: 270.0
    slm_delay_frames: 2

interval_validation_profile_ids:
  - nominal
  - settling_050
  - registration_severe

final_validation_profile_ids:
  - nominal
  - delay_3
  - settling_050
  - registration_moderate
  - registration_severe
  - combined_moderate

validation:
  episodes_per_physical_condition: 16
  steps: 200
  primary_metric: power_in_bucket
  compare_on_identical_episode_seeds: true
  deterministic_policy: true
  persist_per_episode_records: true
  max_violation_fraction: 0.05
  proposed_min_relative_power_gain: 0.02
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0

selection_rule:
  primary_representation_id: zernike_21
  challenger_representation_id: zernike_36
  require_each_policy_seed_to_pass_development_gate: true
  challenger_requires_paired_power_delta_ci95_low_above: 0.0
  challenger_max_violation_fraction: 0.05
  no_selection_before_independent_audit: true

# 280万至290万是容量扫描预留给后续学习的命名空间；290万起属于容量扫描。
protected_seed_ranges:
  - id: all_prior_stages
    start_inclusive: 0
    end_exclusive: 2800000
  - id: representation_capacity_and_future_stages
    start_inclusive: 2900000
    end_exclusive: 4000000

# 仅为共享训练内核保留；R2不会打开S4-D3。
reserved_s4d3_seed_base: 4000000

quick:
  total_transitions_per_seed: 512
  warmup_transitions: 128
  replay_buffer_size: 2048
  batch_size: 64
  updates_per_environment_step: 1
  validation_interval_transitions: 256
  checkpoint_interval_transitions: 512
  log_interval_transitions: 64
  environment_batch_size: 4
  episode_length: 32
  validation_steps: 16
  policy_seeds:
    - 9901
  training_environment_seed_bases:
    - 2880000
  training_hardware_profile_ids:
    - nominal
    - registration_severe
  validation_hardware_profile_ids:
    - nominal
    - registration_severe
  validation_physical_conditions:
    - id: r2_quick_val
      regime: boiling_stationary_wind
      base_seed: 2895000
      wind_speed_mps: 0.50
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2

outputs:
  directory: outputs/s4_residual_sac_r2_v1
  quick_directory: outputs/s4_residual_sac_r2_v1_quick

tracked_source_files:
  - scripts/train_s4_r2_residual_sac.py
  - src/runtime.py
  - src/training_progress.py
  - src/rl/residual_control.py
  - src/rl/residual_sac.py
  - src/rl/s4_training.py
  - src/rl/s4_r2_training.py
  - src/simulation/config.py
  - src/simulation/controllers.py
  - src/simulation/env.py
  - src/simulation/hardware_effects.py
  - src/simulation/modes.py
  - src/simulation/robust_control.py
  - src/simulation/turbulence.py
