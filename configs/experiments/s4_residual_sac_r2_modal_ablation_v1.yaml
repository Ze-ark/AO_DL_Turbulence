  - id: all_modes_quarter
    scale: 0.25
    mask: all
  - id: anchor_only_quarter
    scale: 0.25
    mask: anchor_only
  - id: added_modes_only_quarter
    scale: 0.25
    mask: added_only

diagnostic_profile_ids:
  - nominal
  - delay_3
  - settling_050
  - registration_moderate
  - registration_severe
  - combined_moderate

# 正式消融故意复用上一诊断的开发种子，形成逐回合配对；不读取旧轨迹文件。
diagnostic_physical_conditions:
  - id: r2_diag_frozen
    regime: frozen_stationary
    base_seed: 3100000
    wind_speed_mps: 0.525
    wind_direction_deg: 30.0
    slm_delay_frames: 2
  - id: r2_diag_boiling
    regime: boiling_stationary_wind
    base_seed: 3101000
    wind_speed_mps: 0.625
    wind_direction_deg: 45.0
    frozen_flow_rho: 0.995
    slm_delay_frames: 2
  - id: r2_diag_combined
    regime: boiling_varying_wind_noisy
    base_seed: 3102000
    wind_speed_mps: 0.50
    wind_direction_deg: 85.0
    frozen_flow_rho: 0.995
    wind_speed_modulation_fraction: 0.15
    wind_direction_modulation_deg: 15.0
    wind_modulation_period_frames: 80
    wind_modulation_phase_deg: 270.0
    slm_delay_frames: 2

