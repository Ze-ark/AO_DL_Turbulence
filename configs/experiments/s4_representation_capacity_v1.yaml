metadata:
  stage: S4-D2-R1-REPRESENTATION-CAPACITY
  purpose: nonlearning_action_representation_capacity_diagnostic
  hypothesis: a_higher_dimensional_phase_basis_recovers_the_two_percent_capacity_without_increasing_total_action_energy
  allow_training: false
  allow_optimizer_updates: false
  allow_checkpoint_updates: false
  allow_old_trajectory_access: false
  allow_s4d3_access: false
  allow_real_hardware_actions: false
  allow_simulator_truth_access: true
  allow_exact_registration_parameter_access: true

upstream_registration:
  summary: outputs/s4_registration_oracle_v1/summary.json
  summary_sha256: 680cfe5934f555ed96cd234f57276b42b1cad58807b3bf06d41db2fbc0619181
  source_manifest: outputs/s4_registration_oracle_v1/source_manifest.json
  source_manifest_sha256: 1f9f9b3645b4b122347da829e582c5049a58a61ad3a0082204b02a03f067d884
  experiment_config: configs/experiments/s4_registration_oracle_v1.yaml
  experiment_config_sha256: 0ef38b389f7b3302d07e063db4463ceb588a26f6056579796fb5588c7f73be68
  audit_record: docs/S4-D2-R1配准感知理想控制审计记录.md
  audit_record_sha256: c535d36ba8f1e34c4c74cd7cc1bf8a5cc53b1da160b5c7191efcec8abf57c89e

environment_config: configs/environment/s1_taylor_v1.yaml
environment_config_sha256: 8172a07efb2607544011a9fc959f4ab4fbed9a471de9c0112dd15f1d45e5976a
hardware_profile_source: configs/experiments/s4_hardware_stress_v1.yaml
hardware_profile_source_sha256: fb6cb5a3e86fa0445345e47b084722a5c1613d07eab73f596c32afb6c4ce07e8

frozen_controller:
  id: tracking_conservative
  active_anchor_modes: 10
  kind: tracking_leaky_integrator
  parameters:
    gain: 0.25
    leak: 0.10
    tracking_gain: 0.50
    max_request_step_rad: 0.15

representations:
  - id: zernike_10_anchor
    kind: zernike
    num_modes: 10
  - id: zernike_21
    kind: zernike
    num_modes: 21
  - id: zernike_36
    kind: zernike
    num_modes: 36
  - id: hybrid_spatial_256
    kind: hybrid_spatial
    num_modes: 256

# 每个坐标仍受旧上限约束；高维表示还要共享旧10维盒角对应的总L2预算。
# 因基向量在光瞳内均方根归一化，该L2预算等于总请求相位的均方根预算。
action_budget:
  residual_component_limit_rad: 0.05
  final_component_step_limit_rad: 0.15
  preserve_total_phase_rms_budget: true
  total_budget_anchor_modes: 10
  preserve_environment_modal_limit: true

oracle:
  preview_horizons_frames: [0, 1, 2, 3, 4, 5, 6]
  selection_metric: power_in_bucket
  per_episode_hindsight_envelope: true
  truth_alignment_tolerance: 1.0e-6

registration_inverse:
  method: representation_pupil_least_squares_preconditioner
  uses_exact_simulator_registration_parameters: true
  pseudoinverse_rcond: 1.0e-5
  minimum_rank_fraction: 0.95

comparison:
  anchor_representation_id: zernike_10_anchor
  target_profile_ids:
    - registration_moderate
    - registration_severe

evaluation:
  steps: 200
  episodes_per_physical_condition: 16
  profile_ids:
    - nominal
    - delay_3
    - settling_050
    - registration_moderate
    - registration_severe
    - combined_moderate
  physical_conditions:
    - id: basis_frozen
      regime: frozen_stationary
      base_seed: 2900000
      wind_speed_mps: 0.525
      wind_direction_deg: 30.0
      slm_delay_frames: 2
    - id: basis_boiling
      regime: boiling_stationary_wind
      base_seed: 2901000
      wind_speed_mps: 0.625
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
    - id: basis_combined
      regime: boiling_varying_wind_noisy
      base_seed: 2902000
      wind_speed_mps: 0.50
      wind_direction_deg: 85.0
      frozen_flow_rho: 0.995
      wind_speed_modulation_fraction: 0.15
      wind_direction_modulation_deg: 15.0
      wind_modulation_period_frames: 80
      wind_modulation_phase_deg: 270.0
      slm_delay_frames: 2

gate:
  proposed_min_relative_power_gain: 0.02
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05

comparison_gate:
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05

protected_seed_ranges:
  - id: all_prior_s0_through_registration_oracle
    start_inclusive: 0
    end_exclusive: 2800000
  - id: reserved_future_learning
    start_inclusive: 2800000
    end_exclusive: 2900000

quick:
  steps: 16
  batch_size: 2
  preview_horizons_frames: [0, 2, 4]
  representation_ids:
    - zernike_10_anchor
    - hybrid_spatial_256
  profile_ids:
    - registration_severe
  physical_conditions:
    - id: basis_quick
      regime: boiling_stationary_wind
      base_seed: 2990000
      wind_speed_mps: 0.50
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2

outputs:
  directory: outputs/s4_representation_capacity_v1
  quick_directory: outputs/s4_representation_capacity_v1_quick

tracked_source_files:
  - scripts/run_s4_representation_capacity.py
  - src/runtime.py
  - src/training_progress.py
  - src/rl/s4_training.py
  - src/rl/s4_oracle_bound.py
  - src/rl/s4_registration_oracle.py
  - src/rl/s4_representation_capacity.py
  - src/simulation/config.py
  - src/simulation/controllers.py
  - src/simulation/env.py
  - src/simulation/hardware_effects.py
  - src/simulation/modes.py
  - src/simulation/optics.py
  - src/simulation/robust_control.py
  - src/simulation/slm.py
  - src/simulation/turbulence.py
