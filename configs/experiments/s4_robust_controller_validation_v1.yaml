# 只保留不校正、旧冻结控制器和S4-D0已经选中的唯一候选；不得重新排名。
controllers:
  - id: no_correction
    kind: no_correction
    role: reference
    parameters: {}
  - id: frozen_leaky
    kind: leaky_integrator
    role: incumbent
    parameters:
      gain: 0.35
      leak: 0.10
  - id: tracking_conservative
    kind: tracking_leaky_integrator
    role: frozen_candidate
    parameters:
      gain: 0.25
      leak: 0.10
      tracking_gain: 0.50
      max_request_step_rad: 0.15

evaluation:
  reference_controller: no_correction
  incumbent_controller: frozen_leaky
  frozen_controller: tracking_conservative
  controller_selection_allowed: false
  retuning_allowed: false
  primary_metric: power_in_bucket
  observation_kind: noisy_oracle_modal_features_with_assumed_hardware_errors
  steps: 200
  episodes_per_physical_condition: 32

# 全新种子和未用于S4-D0选型的物理参数；这些种子以后也不得用于RL训练。
physical_conditions:
  - id: d1_frozen_unseen
    regime: frozen_stationary
    base_seed: 1600000
    wind_speed_mps: 0.575
    wind_direction_deg: 35.0
    slm_delay_frames: 2
  - id: d1_boiling_unseen
    regime: boiling_stationary_wind
    base_seed: 1601000
    wind_speed_mps: 0.475
    wind_direction_deg: 80.0
    frozen_flow_rho: 0.995
    slm_delay_frames: 2
  - id: d1_combined_unseen
    regime: boiling_varying_wind_noisy
    base_seed: 1602000
    wind_speed_mps: 0.625
    wind_direction_deg: 40.0
    frozen_flow_rho: 0.995
    wind_speed_modulation_fraction: 0.15
    wind_direction_modulation_deg: 15.0
    wind_modulation_period_frames: 80
    wind_modulation_phase_deg: 225.0
    slm_delay_frames: 2

hardware_profile_ids:
  - nominal
  - delay_3
  - settling_050
  - registration_moderate
  - registration_severe
  - combined_moderate
  - combined_severe

required_profile_ids:
  - nominal
  - delay_3
  - settling_050
  - registration_moderate
  - registration_severe
  - combined_moderate

# 与S4-D0完全相同，不能看完D1结果再修改。
profile_gate:
  min_power_delta_ci95_low: 0.05
  min_mean_relative_power_gain: 0.10
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05
  require_every_condition_power_positive: true

# 除原门槛外，验证开发阶段针对的两个具体修复是否可重复。
validation:
  nominal_profile_id: nominal
  max_nominal_power_drop_fraction: 0.03
  safety_fix_profile_ids:
    - settling_050
  max_violation_fraction: 0.05
  require_lower_violation_than_incumbent: true
  incremental_power_profile_ids:
    - registration_severe
  min_incremental_power_delta_ci95_low: 0.0

outputs:
  directory: outputs/s4_robust_controller_validation_v1
  export_trajectories: true

