# O2-D7：读出噪声与光子噪声的四格短闭环技术检查，不训练、不排名。
schema: observation_bridge_o2_d7_combined_noise_closed_loop_v1
scope: synthetic_combined_noise_short_loop_technical_only
device: cuda
optics_config: configs/experiments/observation_bridge_o2_optics_v1.yaml
parent: configs/experiments/s4_r5_policy_training_v1.yaml
data:
  weather_seed_base: 9200000
  weather_count: 4
  weather_seed_stride: 10000
  episode_length: 32
  camera_ids: [noiseless, read_only, photon_only, combined]
quick:
  weather_seed_base: 9360000
  weather_count: 1
  weather_seed_stride: 10000
  episode_length: 28
  camera_ids: [noiseless, combined]
family_ids: [frozen, boiling, varying]
camera_conditions:
  - {id: noiseless, counts_per_intensity_unit: null, read_noise_std: 0.0}
  - {id: read_only, counts_per_intensity_unit: null, read_noise_std: 1.0}
  - {id: photon_only, counts_per_intensity_unit: 10.0, read_noise_std: 0.0}
  - {id: combined, counts_per_intensity_unit: 10.0, read_noise_std: 1.0}
photon_seed_offset: 200000000
read_seed_offset: 210000000
camera_frame_seed_stride: 10
noise_order: poisson_counts_divided_by_k_then_add_gaussian_then_clip_negative_to_zero
noise_units: arbitrary_synthetic_intensity_not_calibrated_camera_electrons
component_seed_identity_shared_across_conditions: true
noise_components_independent: true
image_dependent_normalization: false
zero_noise_draws: 0
batch_size: 3
controller_branches: 13
policy_initializations: [0, 1, 2]
scorer_seeds: [7564000, 7564001, 7564002]
selector_start_step: 25
integrator: {gain: 0.15, leak: 0.1, tracking_gain: 0.5}
policy_scale: 1.75
candidate_epsilon: 0.1
thresholds:
  ideal_modal_error_max_rad: 0.001
  noisy_modal_rmse_mean_rad: 0.01
  noisy_modal_rmse_p95_rad: 0.02
  replay_max_absolute_error: 1.0e-6
  invalid_observations: 0
  failed_or_truncated_episodes: 0
gain_threshold: null
output_directory: outputs/observation_bridge_o2_d7_combined_noise_closed_loop_v1
quick_directory: outputs/observation_bridge_o2_d7_combined_noise_closed_loop_v1_quick
boundary:
  training_updates: 0
  scientific_gain_analysis: false
  independent_confirmation: false
  old_confirmation_trajectory_access: false
  real_data_access: false
  real_slm_actions: false
  historical_gate_reclassification: false
  truth_fallback: false
  automatic_retry: false
