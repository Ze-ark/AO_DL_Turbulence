# 研究设计清单，不是可执行训练配置。中文说明见R4重设计文档。
stage: S4-D2-R4
design_only: true
runnable: false
status: DESIGN_READY
entrypoint: null
design_document: docs/S4-D2-R4模型式强化学习重设计.md
upstream:
  summary: outputs/s4_r3_h16_veto_gate_confirmation_v1/summary.json
  summary_sha256: fdba00e667a01d1b431b28b83d25e161c18cbabafcf7d08ba846a00c053a42c7
  required_status: VETO_GATE_INDEPENDENT_CONFIRMATION_FAIL
  reuse_old_actor: false
  reuse_old_critic: false
observation:
  history_frames: 8
  residual_modes: 21
  allowed: [measured_residual, issued_commands, previous_corrections, arrived_power_measurement, timestamps, validity_mask, causal_actuator_estimate]
  forbidden: [true_applied_modal, true_turbulence, true_registration, future_randomness, oracle_strehl, hidden_profile_id]
  target_alignment: [residual_observation_next, measured_power_current_action]
  old_student_requires_requalification: true
action:
  total_modes: 21
  anchor_modes: 10
  policy_modes: 11
  normalized_limit: 1.0
  correction_component_limit_rad: 0.0125
  residual_component_limit_rad: 0.05
  final_step_limit_rad: 0.15
  total_l2_anchor_modes: 10
  modal_limit_source: inherit_environment
  projection_shared_with_baselines: true
dynamics:
  baseline: ridge_arx
  nonlinear: frozen_arx_plus_gru_residual
  gru_hidden_size: 64
  ensemble_members: 3
  supervised_horizons: [1, 2, 4, 8]
  target_modes: 21
  power_outputs: 1
  normalization_source: training_only
  initial_updates_per_member: 10000
  subsequent_updates_per_member_per_round: 2000
  batch_sequences: 64
policy:
