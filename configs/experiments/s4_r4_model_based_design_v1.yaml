  hidden_sizes: [128, 128]
  output_initialization: zero
  planning_horizon: 8
  discount: 0.99
  action_cost_weight: 0.01
  ensemble_return_std_penalty: 1.0
  terminal_value_bootstrap: false
  learned_q_network: false
  model_frozen_during_policy_update: true
  stop_action_gradient_through_model: false
  training_initializations: 3
  updates_per_round: 5000
  total_rounds: 3
  development_check_interval: 500
mpc:
  optimizer: cross_entropy_method
  horizon: 8
  population: 128
  iterations: 4
  elites: 16
  include_zero_candidate: true
  share_model_data_cost_projection: true
baseline_selection:
  candidates: [deployable_integrator, causal_estimate_tracking_integrator, ridge_predictor]
  selection_split: development_selection
  exclude_shared_model_mpc: true
  freeze_before_policy_training: true
data:
  seed_namespace: null
  seed_assignment_requires_history_scan: true
  forbid_a10_block: 378
  forbid_seed_at_or_above: 4000000
  initial_training_weather_episodes: 384
  selection_weather_episodes: 96
  confirmation_id_weather_episodes: 96
  confirmation_shift_weather_episodes: 96
  weather_families: 3
  hardware_profiles: 6
  steps_per_episode: 200
  initial_collectors: [anchor, bounded_excitation]
  initial_training_transitions: 921600
  additional_rounds: 2
  additional_weather_episodes_per_round: 96
  additional_collectors: [current_policy, shared_model_mpc]
  additional_transitions_per_policy_initialization: 460800
  additional_transitions_all_initializations: 1382400
  confirmation_generated_after_freeze: true
  model_rollouts_counted_separately: true
gates:
  r4_0: causal_contract_and_impulse_response
  r4_1:
    prediction_error_reduction_vs_persistence: 0.05
    nonlinear_error_reduction_vs_linear: 0.05
    fallback_if_nonlinear_fails: linear_model_mpc_feasibility
    action_direction_balanced_accuracy: 0.60
    action_direction_ci95_lower_min_exclusive: 0.50
    min_identifiable_development_weather_episodes: 50
    identifiable_signal_noise_multiplier: 3.0
    mpc_power_relative_gain_min: 0.01
  r4_2:
    minimum_supporting_policy_initializations: 2
    power_relative_gain_vs_strongest_baseline_min: 0.01
    power_gain_vs_shared_model_mpc_positive: true
  r4_3:
    primary_metric: full_episode_mean_power_in_bucket
    primary_comparators: [strongest_deployable_baseline, shared_model_mpc]
    comparisons_per_split: 6
    bootstrap_unit: weather_episode
    bootstrap_replicates: 20000
    stratification: turbulence_family
    familywise_alpha: 0.05
    minimum_supporting_policy_initializations: 2
    power_relative_gain_vs_baseline_min: 0.01
    strehl_ci95_lower_noninferiority_margin: -0.005
    violation_rate_ci95_upper_increase_max: 0.001
    each_turbulence_power_point_estimate_nonnegative: true
    all_failures_retained: true
boundary:
  device: cuda
  formal_owner: user_ide
  automatic_retry: false
  old_outputs_preserved: true
  real_slm_actions: false
  s4d3_access: false
  current_new_algorithm_trained: false
