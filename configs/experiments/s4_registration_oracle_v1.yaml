metadata:
  stage: S4-D2-R1-REG-ORACLE
  purpose: registration_aware_oracle_action_parameterization_diagnostic
  hypothesis: known_registration_inverse_mapping_recovers_the_two_percent_capacity_in_registration_profiles
  allow_training: false
  allow_optimizer_updates: false
  allow_checkpoint_updates: false
  allow_old_trajectory_access: false
  allow_s4d3_access: false
  allow_real_hardware_actions: false
  allow_simulator_truth_access: true
  allow_exact_registration_parameter_access: true

upstream_action_range:
  summary: outputs/s4_r1_action_range_sweep_v1/summary.json
  summary_sha256: f5baa44fe3975dfb944de7db51b0d81603e245f4b9c3335ce55df7ea5923ea0c
  source_manifest: outputs/s4_r1_action_range_sweep_v1/source_manifest.json
  source_manifest_sha256: 04e756fed825a1e0a1e359a7476e26c6d61e7b37a9d3b6ff53706fa9a048921a
  experiment_config: configs/experiments/s4_r1_action_range_sweep_v1.yaml
  experiment_config_sha256: 775b3bdad58f5f0545b03644527c67e44cd61fef011ecb91e38d8986b7452583
  audit_record: docs/S4-D2-R1理想动作范围扫描审计记录.md
  audit_record_sha256: ccbdaa7ddb268a1de30ac41489602505b0c7c3e57031df9787275db6b7b45a3d

environment_config: configs/environment/s1_taylor_v1.yaml
environment_config_sha256: 8172a07efb2607544011a9fc959f4ab4fbed9a471de9c0112dd15f1d45e5976a
hardware_profile_source: configs/experiments/s4_hardware_stress_v1.yaml
hardware_profile_source_sha256: fb6cb5a3e86fa0445345e47b084722a5c1613d07eab73f596c32afb6c4ce07e8

frozen_controller:
  id: tracking_conservative
  kind: tracking_leaky_integrator
  parameters:
    gain: 0.25
    leak: 0.10
    tracking_gain: 0.50
    max_request_step_rad: 0.15

policy_observation:
  history_frames: 4
  include_oracle_quality_metrics: false
  fields:
    - residual_modal_noisy
    - applied_modal
    - requested_modal
    - frozen_baseline_delta

# 固定为上一阶段扫描过的最大范围；本阶段只改变动作参数化。
action:
  num_modes: 10
  residual_action_limit_rad: 0.05
  final_action_step_limit_rad: 0.15
  preserve_environment_modal_limit: true

oracle:
  preview_horizons_frames: [0, 1, 2, 3, 4, 5, 6]
  selection_metric: power_in_bucket
  per_episode_hindsight_envelope: true
  truth_alignment_tolerance: 1.0e-6

registration_inverse:
  method: full_pupil_least_squares_modal_preconditioner
  uses_exact_simulator_registration_parameters: true
  parameters_used:
    - phase_scale
    - shift_x_pixels
    - shift_y_pixels
    - rotation_deg
  pseudoinverse_rcond: 1.0e-5
  max_condition_number: 10.0
  identity_tolerance: 1.0e-6
  target_profile_ids:
    - registration_moderate
    - registration_severe
  invariant_profile_ids:
    - nominal
    - delay_3
    - settling_050

evaluation:
  steps: 200
  episodes_per_physical_condition: 16
  profile_ids:
    - nominal
    - delay_3
    - settling_050
    - registration_moderate
    - registration_severe
    - combined_moderate
  physical_conditions:
    - id: reg_frozen
      regime: frozen_stationary
      base_seed: 2700000
      wind_speed_mps: 0.525
      wind_direction_deg: 30.0
      slm_delay_frames: 2
    - id: reg_boiling
      regime: boiling_stationary_wind
      base_seed: 2701000
      wind_speed_mps: 0.625
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
    - id: reg_combined
      regime: boiling_varying_wind_noisy
      base_seed: 2702000
      wind_speed_mps: 0.50
      wind_direction_deg: 85.0
      frozen_flow_rho: 0.995
      wind_speed_modulation_fraction: 0.15
      wind_direction_modulation_deg: 15.0
      wind_modulation_period_frames: 80
      wind_modulation_phase_deg: 270.0
      slm_delay_frames: 2

# 配准感知控制器仍需相对冻结传统控制器通过原完整门槛。
gate:
  proposed_min_relative_power_gain: 0.02
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05

# 在两个独立配准档位中还必须显著优于盲配准理想控制器。
comparison_gate:
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05

protected_seed_ranges:
  - id: all_prior_s0_through_action_range
    start_inclusive: 0
    end_exclusive: 2700000

reserved_future_learning_seed_base: 2800000

quick:
  steps: 16
  batch_size: 2
  preview_horizons_frames: [0, 2, 4]
  profile_ids:
    - registration_severe
  physical_conditions:
    - id: reg_quick
      regime: boiling_stationary_wind
      base_seed: 2790000
      wind_speed_mps: 0.50
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2

outputs:
  directory: outputs/s4_registration_oracle_v1
  quick_directory: outputs/s4_registration_oracle_v1_quick

tracked_source_files:
  - scripts/run_s4_registration_oracle.py
  - src/runtime.py
  - src/training_progress.py
  - src/rl/residual_control.py
  - src/rl/s4_training.py
  - src/rl/s4_oracle_bound.py
  - src/rl/s4_action_range_sweep.py
  - src/rl/s4_registration_oracle.py
  - src/simulation/config.py
  - src/simulation/controllers.py
  - src/simulation/env.py
  - src/simulation/hardware_effects.py
  - src/simulation/modes.py
  - src/simulation/optics.py
  - src/simulation/robust_control.py
  - src/simulation/slm.py
  - src/simulation/turbulence.py
