representation:
  id: zernike_21_added_11
  kind: zernike
  num_modes: 21
  anchor_modes: 10
  output_modes: 11

frozen_controller:
  id: tracking_conservative
  active_anchor_modes: 10
  kind: tracking_leaky_integrator
  parameters:
    gain: 0.25
    leak: 0.10
    tracking_gain: 0.50
    max_request_step_rad: 0.15

action_budget:
  residual_component_limit_rad: 0.05
  final_component_step_limit_rad: 0.15
  preserve_total_phase_rms_budget: true
  total_budget_anchor_modes: 10
  preserve_environment_modal_limit: true

teacher:
  preview_horizon_frames: 2
  uses_future_simulator_truth_for_labels: true
  uses_exact_registration_for_labels: true
  target: realized_added_residual_normalized_by_component_limit
  anchor_residual_coordinates_forced_zero: true

policy_observation:
  history_frames: 4
  state_size: 210
  include_future_truth: false
  include_oracle_quality_metrics: false
  include_hardware_profile_identifier: false
  fields:
    - residual_modal_noisy_all_21_modes
    - applied_modal_all_21_modes
    - requested_modal_all_21_modes
    - frozen_ten_mode_baseline_delta_zero_padded

model:
  kind: two_layer_mlp_matching_old_sac_actor_backbone
  hidden_size: 256
  output_activation: tanh
  output_size: 11
  ridge_alpha: 0.001

training:
  initialization_seeds: [8201, 8202, 8203]
  batch_size: 1024
  learning_rate: 0.0003
  weight_decay: 0.000001
  max_optimizer_steps: 6000
  min_optimizer_steps: 1500
  validation_interval_steps: 200
  early_stopping_patience_checks: 10
  early_stopping_relative_min_delta: 0.0005
  gradient_clip_norm: 1.0
  normalization_min_scale: 0.000001

dataset:
  steps_per_episode: 200
  training_episodes_per_condition: 32
  validation_episodes_per_condition: 16
  diagnostic_test_episodes_per_condition: 16
  profile_ids:
    - nominal
    - delay_3
    - settling_050
    - registration_moderate
    - registration_severe
    - combined_moderate
  training_conditions:
    - id: learn_train_frozen
      regime: frozen_stationary
      base_seed: 3300000
      wind_speed_mps: 0.45
      wind_direction_deg: 15.0
      slm_delay_frames: 2
    - id: learn_train_boiling
      regime: boiling_stationary_wind
      base_seed: 3301000
      wind_speed_mps: 0.55
      wind_direction_deg: 60.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
    - id: learn_train_combined
      regime: boiling_varying_wind_noisy
      base_seed: 3302000
      wind_speed_mps: 0.60
      wind_direction_deg: 75.0
      frozen_flow_rho: 0.995
      wind_speed_modulation_fraction: 0.15
      wind_direction_modulation_deg: 15.0
      wind_modulation_period_frames: 80
      wind_modulation_phase_deg: 135.0
      slm_delay_frames: 2
  validation_conditions:
    - id: learn_val_frozen
      regime: frozen_stationary
      base_seed: 3400000
      wind_speed_mps: 0.50
      wind_direction_deg: 25.0
      slm_delay_frames: 2
    - id: learn_val_boiling
      regime: boiling_stationary_wind
      base_seed: 3401000
      wind_speed_mps: 0.60
      wind_direction_deg: 50.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
    - id: learn_val_combined
      regime: boiling_varying_wind_noisy
      base_seed: 3402000
      wind_speed_mps: 0.55
      wind_direction_deg: 80.0
      frozen_flow_rho: 0.995
      wind_speed_modulation_fraction: 0.15
      wind_direction_modulation_deg: 15.0
      wind_modulation_period_frames: 80
      wind_modulation_phase_deg: 225.0
      slm_delay_frames: 2
  diagnostic_test_conditions:
    - id: learn_test_frozen
      regime: frozen_stationary
      base_seed: 3450000
      wind_speed_mps: 0.525
      wind_direction_deg: 30.0
      slm_delay_frames: 2
    - id: learn_test_boiling
      regime: boiling_stationary_wind
      base_seed: 3451000
      wind_speed_mps: 0.625
      wind_direction_deg: 45.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
    - id: learn_test_combined
      regime: boiling_varying_wind_noisy
      base_seed: 3452000
      wind_speed_mps: 0.50
      wind_direction_deg: 85.0
      frozen_flow_rho: 0.995
      wind_speed_modulation_fraction: 0.15
      wind_direction_modulation_deg: 15.0
      wind_modulation_period_frames: 80
      wind_modulation_phase_deg: 270.0
      slm_delay_frames: 2

offline_gate:
  min_skill_score_against_zero: 0.30
  min_mean_cosine_similarity: 0.30
  require_every_initialization: true

closed_loop_gate:
  proposed_min_relative_power_gain: 0.02
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05
  require_all_profiles_pass: true
  require_every_initialization: true

protected_seed_ranges:
  - id: all_prior_stages_and_capacity
    start_inclusive: 0
    end_exclusive: 3300000
  - id: reserved_future_rl_and_s4d3
    start_inclusive: 3500000
    end_exclusive: 5000000

