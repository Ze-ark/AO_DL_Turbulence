  experiment_id: AO-S4-D2-R3-D2-A-CRITIC-TARGET-REPAIR
  version_label: s4d2_r3_d2a_critic_target_repair_design_v1
  purpose: predeclare_frozen_actor_multistep_critic_target_repair
  hypothesis: a_longer_or_mixed_return_target_can_correct_the_failed_actor_ranking_before_actor_retraining
  user_authorized_design: true
  allow_formal_training: false
