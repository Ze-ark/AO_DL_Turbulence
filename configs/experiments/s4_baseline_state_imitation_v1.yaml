      base_seed: 3499200
      wind_speed_mps: 0.60
      wind_direction_deg: 55.0
      frozen_flow_rho: 0.995
      slm_delay_frames: 2
  initialization_seeds: [8201]
  hidden_size: 32
  batch_size: 16
  max_optimizer_steps: 20
  min_optimizer_steps: 4
  validation_interval_steps: 2
  early_stopping_patience_checks: 4
  deployment_scales: [0.10, 0.50]
  primary_scale: 0.50
  time_bins:
    - {id: quick_000_004, start: 0, stop: 5}
    - {id: quick_005_009, start: 5, stop: 10}
    - {id: quick_010_014, start: 10, stop: 15}
    - {id: quick_015_019, start: 15, stop: 20}
  reference_predictor_ids: [teacher_ridge, teacher_mlp_seed_8201]

