offline_gate:
  min_skill_score_against_zero: 0.30
  min_mean_cosine_similarity: 0.30
  require_every_initialization: true

closed_loop_gate:
  proposed_min_relative_power_gain: 0.02
  min_power_delta_ci95_low: 0.0
  min_strehl_delta_ci95_low: 0.0
  max_phase_rmse_delta_ci95_high: 0.0
  max_violation_fraction: 0.05
  require_all_profiles_pass: true
  require_every_initialization: true

data_source_gate:
  max_new_to_old_mse_ratio: 0.50
  min_primary_gain_improvement_over_old: 0.02

evaluation:
  deployment_scales: [0.10, 0.25, 0.50]
  primary_scale: 0.50
  time_bins:
    - {id: warmup_000_019, start: 0, stop: 20}
    - {id: early_020_049, start: 20, stop: 50}
    - {id: middle_050_099, start: 50, stop: 100}
    - {id: late_100_149, start: 100, stop: 150}
    - {id: final_150_199, start: 150, stop: 200}

interpretation_thresholds:
  on_policy_mse_over_offline_reference_min: 2.00
  on_policy_mse_ratio_late_over_early_min: 1.50
  state_ood_fraction_increase_min: 0.02
  cumulative_added_request_ratio_late_over_early_min: 1.25
  reduced_scale_improvement_over_full_scale_min: 0.05
  zero_alignment_max_abs_error: 0.000005
  projection_comparison_tolerance_rad: 0.0000001

protected_seed_ranges:
  - id: all_prior_stages
    start_inclusive: 0
    end_exclusive: 3470000
  - id: reserved_future_rl_and_s4d3
    start_inclusive: 3500000
    end_exclusive: 5000000

