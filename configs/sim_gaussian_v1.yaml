data:
  # 仿真 HDF5 数据文件；用于有标签的训练集和测试集。
  simulated_h5_path: data/raw_matlab_exports/sim_gaussian_v1.h5

  # 训练集比例；剩余仿真样本自动作为测试集。
  train_fraction: 0.8

  # 仿真验证集比例；当前真实实验数据单独作为 validation，所以这里保持 0。
  val_fraction: 0.0

  # 随机种子；用于固定 train/test 划分。
  seed: 42

model:
  # ResUNet 基础通道数；越大模型容量越强，但显存占用和训练时间也越高。
  base_channels: 32

train:
  # 训练轮数；1 个 epoch 表示完整遍历一次训练集。
  epochs: 100

  # 训练 batch 大小；越大训练越快，但更占显存。
  batch_size: 10

  # 学习率；控制每次参数更新步长。
  learning_rate: 0.001

  # 权重衰减；AdamW 用它抑制过拟合。
  weight_decay: 0.0001

  # checkpoint 保存目录；保存仿真测试集 loss 最低的模型。
  checkpoint_dir: checkpoints

  # 训练日志输出目录；loss_history.csv 会写到这里。
  output_dir: outputs/train_sim_gaussian_v1

eval:
  # 有标签仿真评估使用的数据划分；当前默认测试集。
  split: test

  # 仿真评估 batch 大小。
  batch_size: 4

  # 评估和真实验证加载的模型权重。
  checkpoint_path: checkpoints/sim_gaussian_v1_best.pt

  # 有标签仿真评估输出目录。
  output_dir: outputs/eval_sim_gaussian_v1

validation:
  # 真实实验 PNG 根目录；MATLAB 导出脚本从这里读取离轴全息图。
  real_root: E:\加扩束镜\2倍放大

  # MATLAB 导出的真实复光场验证集；Python 验证脚本读取这个 HDF5。
  real_h5_path: data/real_validation/real_offaxis_2x_validation.h5

  # 每个温差最多导出多少帧；设为 null 表示导出全部约 5 万帧。
  max_frames_per_temperature: 200

  # MATLAB 导出时把真实复光场统一缩放到的尺寸，格式为 [高度, 宽度]。
  image_size: [256, 256]

  # 真实验证 batch 大小。
  batch_size: 8

  # 真实验证输出目录；保存 summary CSV 和示例图。
  output_dir: outputs/real_validation_2x

runtime:
  # 运行设备；本项目强制 GPU 训练和验证，只允许 cuda 或 gpu。
  device: cuda
